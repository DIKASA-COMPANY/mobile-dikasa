name: Mobile CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze application and generated API package
        run: flutter analyze --no-pub
      - name: Analyze generated API independently
        run: dart analyze packages/dikasa_api
      - name: Test release promotion guards
        run: python3 -m unittest discover -s tool/ci -p 'test_*.py' -v
      - name: Run unit and widget tests
        run: flutter test --no-pub --coverage
      - name: Save coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Android build validation
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile
      - name: Build DEV APK without release credentials
        run: flutter build apk --debug --flavor dev --no-pub --dart-define=USE_MOCK_API=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-dev-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 7
